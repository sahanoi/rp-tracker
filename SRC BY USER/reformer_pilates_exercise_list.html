* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.container { padding: 1rem 0; }
.search-bar { margin-bottom: 1.5rem; }
.search-bar input { width: 100%; padding: 10px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary); }
.search-bar input:focus { outline: none; border-color: var(--color-border-primary); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
.filter-btn { padding: 6px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: 20px; font-size: 13px; background: var(--color-background-secondary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.filter-btn.active { background: var(--color-background-primary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
.filter-btn:hover { border-color: var(--color-border-primary); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
.category { margin-bottom: 2rem; }
.category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.category-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.category-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.category-count { font-size: 12px; color: var(--color-text-secondary); margin-left: auto; }
.exercises-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.exercise-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 14px; }
.exercise-card:hover { border-color: var(--color-border-secondary); }
.ex-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.ex-name-tr { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
.ex-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; }
.tag-beginner { background: #EAF3DE; color: #3B6D11; }
.tag-intermediate { background: #FAEEDA; color: #854F0B; }
.tag-advanced { background: #FAECE7; color: #993C1D; }
.tag-breathing { background: #EEEDFE; color: #3C3489; }
.no-results { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }
.hidden { display: none; }
</style>

let activeFilter = "all";
let searchText = "";

function setFilter(level, btn) {
  activeFilter = level;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  filterAll();
}

function filterAll() {
  searchText = document.getElementById("searchInput").value.toLowerCase();
  render();
}

  let totalVisible = 0;
  let catsShown = 0;

  data.forEach(cat => {
    const exercises = cat.exercises.filter(ex => {
      const matchLevel = activeFilter === "all" || ex.levels.includes(activeFilter);
      const matchSearch = !searchText || 
        ex.name.toLowerCase().includes(searchText) || 
        (typeof ex.tr === "string" && ex.tr.toLowerCase().includes(searchText));
      return matchLevel && matchSearch;
    });

    if (exercises.length === 0) return;
    catsShown++;
    totalVisible += exercises.length;

    const sec = document.createElement("div");
    sec.className = "category";
    sec.innerHTML = `
      <div class="category-header">
        <div class="category-dot" style="background:${cat.color}"></div>
        <span class="category-title">${cat.title}</span>
        <span class="category-count">${exercises.length} egzersiz</span>
      </div>
      <div class="exercises-grid">
        ${exercises.map(ex => {
          const tags = ex.levels.map(l => {
            const labels = { beginner: "Başlangıç", intermediate: "Orta", advanced: "İleri" };
            return `<span class="tag tag-${l}">${labels[l]}</span>`;
          }).join("");
          const trText = Array.isArray(ex.tr) ? ex.tr[0] : ex.tr;
          return `
            <div class="exercise-card">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-name-tr">${trText}</div>
              <div class="ex-tags">${tags}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
    container.appendChild(sec);
  });

  if (totalVisible === 0) {
    container.innerHTML = `<div class="no-results">Arama kriterlerine uygun egzersiz bulunamadı.</div>`;
  }

  const total = data.reduce((s, c) => s + c.exercises.length, 0);
  document.getElementById("totalCount").textContent = total;
  document.getElementById("catCount").textContent = data.length;
  document.getElementById("visibleCount").textContent = totalVisible;
}

render();
</script>
